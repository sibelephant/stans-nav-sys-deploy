services:
  stans:
    image: ${STANS_IMAGE:-ghcr.io/your-org/stans-nav-sys-deploy:latest}
    container_name: stans-app
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
